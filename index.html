<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V3-26 응답경로 2차 정밀진단</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:20px auto;padding:0 14px;background:#f5f5f5}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}
button{font-size:17px;padding:11px 14px;margin:4px;border:1px solid #aaa;border-radius:9px;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#111;color:#eee;padding:14px;border-radius:10px;min-height:220px}
</style></head><body>
<div class="card"><h2>V3-26 응답 전달경로 2차 정밀진단</h2>
<p>시트/투입/철수는 건드리지 않습니다. GET·POST의 fetch 대기, body, redirect, 최종 URL, HTTP 상태, Content-Type과 Resource Timing을 기록합니다.</p>
<button onclick="series(20)">GET/POST 각 20회</button>
<button onclick="one('GET')">GET 1회</button><button onclick="one('POST')">POST 1회</button>
<button onclick="clearAll()">초기화</button></div>
<div class="card"><div id="sum">대기 중</div></div><div class="card"><pre id="log"></pre></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzhssvduJsmqd27QBArEf_z6gOmD691RFdn0GMdNPtZkOYIkEIcgD9n3mlAFv-tK30g/exec'; let rows=[],running=false;
const sl=m=>new Promise(r=>setTimeout(r,m)), q=n=>Math.round(n*100)/100;
function resource(url,start){
 const es=performance.getEntriesByType('resource').filter(e=>e.name===url || e.name.startsWith(url.split('?')[0]));
 const e=es.length?es[es.length-1]:null;
 if(!e)return null;
 return {name:e.name,redirect:q(e.redirectEnd-e.redirectStart),requestToResponse:q(e.responseStart-e.requestStart),
 response:q(e.responseEnd-e.responseStart),duration:q(e.duration),start:q(e.startTime-start)};
}
async function one(kind){
 const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);
 let url=API, init={cache:'no-store'};
 if(kind==='GET') url=API+'?action=pingDiag&rid='+encodeURIComponent(id)+'&t='+Date.now();
 else {const p=new URLSearchParams();p.set('action','pingPostDiag');p.set('rid',id);p.set('t',Date.now());init={method:'POST',body:p,cache:'no-store'};}
 const t0=performance.now(); let r,txt='',data=null,err='';
 try{
   r=await fetch(url,init); const tf=performance.now();
   txt=await r.text(); const tb=performance.now();
   try{data=JSON.parse(txt)}catch(e){err='JSON아님: '+txt.slice(0,100).replace(/\s+/g,' ')}
   const server=data&&data.serverWorkMs!=null?Number(data.serverWorkMs)/1000:0;
   const row={kind,id,total:(tb-t0)/1000,fetch:(tf-t0)/1000,body:(tb-tf)/1000,server,
     redirected:r.redirected,status:r.status,type:r.type,ct:r.headers.get('content-type')||'-',
     finalUrl:r.url,rt:resource(url,t0),err};
   rows.push(row); print(row);
 }catch(e){rows.push({kind,id,total:(performance.now()-t0)/1000,err:String(e)});print(rows[rows.length-1]);}
 summarize();
}
function print(x){
 let s=`${rows.length}. ${x.kind} 전체 ${q(x.total)}초 | fetch ${q(x.fetch||0)}초 | body ${q(x.body||0)}초 | 서버 ${q(x.server||0)}초\n`;
 s+=`   HTTP ${x.status||'-'} | redirect ${x.redirected} | type ${x.type||'-'} | Content-Type ${x.ct||'-'}\n`;
 if(x.finalUrl)s+=`   최종URL: ${x.finalUrl}\n`;
 if(x.rt)s+=`   ResourceTiming: redirect ${x.rt.redirect}ms | request→responseStart ${x.rt.requestToResponse}ms | response ${x.rt.response}ms | duration ${x.rt.duration}ms\n`;
 else s+=`   ResourceTiming: 상세값 없음(교차출처 제한 가능)\n`;
 if(x.err)s+=`   오류: ${x.err}\n`;
 document.getElementById('log').textContent=s+document.getElementById('log').textContent;
}
function summarize(){
 const f=k=>rows.filter(x=>x.kind===k&&Number.isFinite(x.total));
 const z=a=>a.length?`평균 ${q(a.reduce((s,x)=>s+x.total,0)/a.length)}초 / 최대 ${q(Math.max(...a.map(x=>x.total)))}초`:'-';
 document.getElementById('sum').innerHTML=`GET ${z(f('GET'))}<br>POST ${z(f('POST'))}`;
}
async function series(n){if(running)return;running=true;try{for(let i=0;i<n;i++){await one('GET');await sl(500);await one('POST');await sl(800);}}finally{running=false}}
function clearAll(){rows=[];performance.clearResourceTimings();document.getElementById('log').textContent='';summarize();}
</script></body></html>
