<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V3-26 GET/POST 통신경로 진단</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;background:#f7f7f7}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}
button{font-size:18px;padding:12px 16px;margin:4px;border-radius:10px;border:1px solid #aaa;background:white}
pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:14px;border-radius:10px;min-height:180px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:right}th:first-child,td:first-child{text-align:left}
</style>
</head>
<body>
<div class="card">
<h2>V3-26 빈 GET / 빈 POST 통신경로 진단</h2>
<p>시트 저장, 대원 투입, CURRENT/HISTORY, 카드 생성 없이 Apps Script 응답 경로만 측정합니다.</p>
<button onclick="runOne('GET')">GET 1회</button>
<button onclick="runOne('POST')">POST 1회</button>
<button onclick="runSeries(20)">GET/POST 각 20회</button>
<button onclick="clearLog()">초기화</button>
</div>
<div class="card"><div id="summary">아직 측정하지 않음</div></div>
<div class="card"><pre id="log"></pre></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzhssvduJsmqd27QBArEf_z6gOmD691RFdn0GMdNPtZkOYIkEIcgD9n3mlAFv-tK30g/exec';
const rows=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function q(n){return Math.round(n*10)/10}
function add(r){
 rows.push(r);
 const line=`${rows.length}. ${r.kind} 전체 ${q(r.total)}초 | 서버 ${q(r.server)}초 | 응답전달추정 ${q(r.delivery)}초`;
 document.getElementById('log').textContent=line+"\n"+document.getElementById('log').textContent;
 summarize();
}
function summarize(){
 if(!rows.length){document.getElementById('summary').textContent='아직 측정하지 않음';return;}
 const s=k=>rows.filter(x=>x.kind===k);
 const fmt=a=>{
   if(!a.length)return '-';
   const v=a.map(x=>x.total).sort((a,b)=>a-b);
   const avg=v.reduce((x,y)=>x+y,0)/v.length;
   return `${a.length}회 / 평균 ${q(avg)}초 / 최소 ${q(v[0])}초 / 최대 ${q(v[v.length-1])}초`;
 };
 document.getElementById('summary').innerHTML=`<b>GET</b> ${fmt(s('GET'))}<br><b>POST</b> ${fmt(s('POST'))}`;
}
async function runOne(kind){
 const start=performance.now();
 let data;
 if(kind==='GET'){
   const r=await fetch(API+'?action=pingDiag&t='+Date.now(),{cache:'no-store'});
   data=await r.json();
 }else{
   const p=new URLSearchParams();p.set('action','pingPostDiag');p.set('t',String(Date.now()));
   const r=await fetch(API,{method:'POST',body:p,cache:'no-store'});
   data=await r.json();
 }
 const end=performance.now();
 const total=(end-start)/1000;
 const server=Math.max(0,Number(data.serverWorkMs||0))/1000;
 add({kind,total,server,delivery:Math.max(0,total-server),data});
}
let running=false;
async function runSeries(n){
 if(running)return; running=true;
 try{
   for(let i=0;i<n;i++){
     await runOne('GET'); await sleep(500);
     await runOne('POST'); await sleep(1000);
   }
 }catch(e){document.getElementById('log').textContent='오류: '+e.message+'\n'+document.getElementById('log').textContent;}
 finally{running=false;}
}
function clearLog(){rows.length=0;document.getElementById('log').textContent='';summarize();}
</script>
</body></html>
